name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libro_cogs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d libro_cogs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATA_LIFECYCLE_ENV: DEVELOPMENT
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/libro_cogs_test
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci_only_secret_with_at_least_32_characters
      COOKIE_NAME: libro_session
      SEED_OWNER_PASSWORD: owner123
      SEED_MANAGER_PASSWORD: manager123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Migrate test database
        run: npm run db:migrate
        working-directory: backend
      - name: Seed test database
        run: npm run db:seed
        working-directory: backend
      - name: Check and test backend
        run: npm run typecheck && npm run build && npm test -- --exclude "**/*.pg.test.ts"
        working-directory: backend
      - name: Create isolated PostgreSQL integration databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for database in libro_phasec_final_ci_e2e libro_phasec_anomaly_ci_e2e libro_phase3fix12_password_ci_e2e libro_fix12_email_reminder_ci_e2e; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${database}"
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${database}" npm run db:migrate
          done
        working-directory: backend
      - name: Run required PostgreSQL integration suites
        run: |
          set -euo pipefail
          run_required_suite() {
            local variable="$1"
            local database="$2"
            local test_file="$3"
            local output
            output="$(env "${variable}=postgresql://postgres:postgres@localhost:5432/${database}" npx vitest run "${test_file}" --reporter=verbose --no-color 2>&1)" || { echo "${output}"; return 1; }
            echo "${output}"
            echo "${output}" | grep -Eq 'Tests[[:space:]]+[1-9][0-9]* passed'
            if echo "${output}" | grep -Eq 'Tests.*[1-9][0-9]* skipped'; then
              echo "Required PostgreSQL suite was skipped: ${test_file}" >&2
              return 1
            fi
          }
          run_required_suite PHASE_C_E2E_DATABASE_URL libro_phasec_final_ci_e2e src/controllers/inventoryWorkflow.finalWorkflow.pg.test.ts
          run_required_suite PHASE_C_E2E_DATABASE_URL libro_phasec_anomaly_ci_e2e src/controllers/inventoryWorkflow.anomalyIntegration.pg.test.ts
          run_required_suite PASSWORD_RESET_E2E_DATABASE_URL libro_phase3fix12_password_ci_e2e src/services/passwordReset.pg.test.ts
          run_required_suite POS_REMINDER_E2E_DATABASE_URL libro_fix12_email_reminder_ci_e2e src/services/posImportReminderEmail.pg.test.ts
        working-directory: backend
      - name: Remove isolated PostgreSQL integration databases
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          for database in libro_phasec_final_ci_e2e libro_phasec_anomaly_ci_e2e libro_phase3fix12_password_ci_e2e libro_fix12_email_reminder_ci_e2e; do
            dropdb -h localhost -U postgres --if-exists --force "${database}"
          done
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Check and test frontend
        run: npm run typecheck && npm run build && npm test
        working-directory: frontend
