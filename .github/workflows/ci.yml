name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libro_cogs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d libro_cogs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/libro_cogs_test
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci_only_secret_with_at_least_32_characters
      COOKIE_NAME: libro_session
      SEED_OWNER_PASSWORD: owner123
      SEED_MANAGER_PASSWORD: manager123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Migrate test database
        run: npm run db:migrate
        working-directory: backend
      - name: Seed test database
        run: npm run db:seed
        working-directory: backend
      - name: Check and test backend
        run: npm run typecheck && npm run build && npm test
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Check and test frontend
        run: npm run typecheck && npm run build && npm test
        working-directory: frontend
